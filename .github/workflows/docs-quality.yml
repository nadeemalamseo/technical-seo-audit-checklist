name: Documentation quality

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "checklist.md"
      - "methodology.md"
      - "index.html"
      - "index.md"
      - "scripts/**"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "checklist.md"
      - "methodology.md"
      - "index.html"
      - "index.md"
      - "scripts/**"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate checklist structure and project links
        run: python scripts/validate_docs.py
